[project]
authors = [{name = "Vishal Mopari", email = "vamopari@gmail.com"}]
dependencies = []
name = "booking-analysis"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
booking_analysis = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
pandas = ">=3.0.5,<4"
scikit-learn = ">=1.9.0,<2"
streamlit = ">=1.61.1,<2"
matplotlib = ">=3.11.1,<4"
